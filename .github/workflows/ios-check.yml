# Proves the iOS project generates and compiles on Xcode 27, with no signing,
# and checks the things App Review and the iPhone Duo depend on. Results are
# printed as annotations so they can be read without opening the log.
# Shipping is done locally: npm run ios:init once, then npm run ios:build.

name: iOS build check

on:
  workflow_dispatch:
  push:
    branches: [ios-duo]

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Xcode in use
        run: echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ') / $(xcrun --sdk iphoneos --show-sdk-version)"

      - run: npx tauri ios init --ci

      - name: App icon is opaque
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow || { echo "::error::pillow install failed"; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" scripts/ios_icons.py || { echo "::error::icon script failed"; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          from PIL import Image
          im = Image.open("src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png")
          assert im.size == (1024, 1024) and im.mode == "RGB", (im.size, im.mode)
          print("::notice title=Icon::1024px RGB, no alpha")
          PY

      - name: Project is iPhone only
        run: |
          grep -q 'TARGETED_DEVICE_FAMILY: "1"' src-tauri/gen/apple/project.yml \
            || { echo "::error::iPad family is still on"; exit 1; }

      - name: Build for the simulator
        run: npx tauri ios build --ci --debug --target aarch64-sim

      - name: Check the built app
        run: |
          APP=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' -path '*iphonesimulator*' 2>/dev/null | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found"; exit 1; }
          PLIST="$APP/Info.plist"
          FAMILY=$(plutil -extract UIDeviceFamily json -o - "$PLIST")
          echo "::notice title=Built app::$APP | UIDeviceFamily=$FAMILY | MinOS=$(plutil -extract MinimumOSVersion raw -o - "$PLIST") | SDK=$(plutil -extract DTSDKName raw -o - "$PLIST" 2>/dev/null)"
          [ "$FAMILY" = "[1]" ] || { echo "::error::UIDeviceFamily is $FAMILY, expected [1]"; exit 1; }
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is not in the app"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$PLIST" | grep -qi false \
            || { echo "::error::export-compliance key missing"; exit 1; }
          echo "::notice title=Orientations::$(plutil -extract UISupportedInterfaceOrientations json -o - "$PLIST")"
          echo "::notice title=FullScreenKey::UIRequiresFullScreen=$(plutil -extract UIRequiresFullScreen raw -o - "$PLIST" 2>&1 | tail -1)"

      - name: Launch on a simulator
        continue-on-error: true
        run: |
          APP=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' -path '*iphonesimulator*' 2>/dev/null | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[(k,x['udid']) for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(sorted(c)[-1][1])")
          RT=$(xcrun simctl list devices available | grep -B30 "$UDID" | grep -E '^-- iOS' | tail -1)
          step() { out=$("$@" 2>&1); rc=$?; echo "::notice title=$1 $2 rc=$rc::$(echo "$out" | tail -3 | tr '\n' ' ')"; return 0; }
          echo "::notice title=Device::$UDID app=$APP"
          step xcrun simctl boot "$UDID"
          step xcrun simctl bootstatus "$UDID" -b
          step xcrun simctl install "$UDID" "$APP"
          PID=$(xcrun simctl launch "$UDID" in.kjrlabs.tilde | awk -F': ' '{print $2}')
          echo "::notice title=Launched::pid $PID"
          for t in 2 5 10 20; do sleep $t; if ps -p "$PID" >/dev/null; then echo "::notice title=Alive::pid $PID alive at +${t}s step"; else echo "::notice title=Dead::pid $PID gone at +${t}s step"; break; fi; done
          sleep 3
          echo "::notice title=Device state::$(xcrun simctl list devices | grep "$UDID" | tr -s ' ')"
          for f in $(ls -t "$HOME"/Library/Logs/DiagnosticReports/*Tilde* 2>/dev/null | head -1); do
            echo "::notice title=Crash report::$f $(grep -E '"(exception|termination)"|Exception Type|Termination|asi|"reason"|"indicator"' "$f" | head -12 | tr -s ' ' | tr '\n' ' ' | cut -c1-900)"
          done
          echo "::notice title=Log::$(xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "Tilde" OR eventMessage CONTAINS "in.kjrlabs.tilde"' 2>&1 | grep -iE 'scene|terminat|abort|assert|crash|exception|fatal|panic' | head -8 | cut -c1-400 | tr '\n' ' ')"
          xcrun simctl io "$UDID" screenshot launch.png || echo "::notice title=Screenshot::failed"
          "$RUNNER_TEMP/venv/bin/python" -c "
          from PIL import Image
          im = Image.open('launch.png').convert('RGB').resize((200, 400))
          px = list(im.getdata()); n = len(set(px))
          print('::notice title=Screen::distinct colours', n, 'mean', [sum(c[i] for c in px)//len(px) for i in range(3)])" || true
          if ps -p "$PID" >/dev/null; then echo "::notice title=Launch::still running after 25s"; else echo "::error::app exited within 25s of launch"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: launch.png
          if-no-files-found: ignore
