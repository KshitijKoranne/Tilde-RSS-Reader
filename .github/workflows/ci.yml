# Typecheck, test and build on every push and pull request.
#
# The tests cover src/lib — the parsing, sanitising and storage layer, which is
# where untrusted input from the open web arrives and where the archive lives.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
