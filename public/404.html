<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Tilde</title>
    <meta name="description" content="That page does not exist. Go back to Tilde, the free RSS reader for Mac and the web." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/tilde-icon.svg" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { --bg: #f3f2f2; --text: #201e1d; --muted: #605d5d; --rule: #d7d3d3; --link: #ae1800; --accent: #ec3013; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1b1a19; --text: #ece9e8; --muted: #aaa5a4; --rule: #3a3736; --link: #ff9783; --accent: #ff563c; }
      }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 ui-serif, "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
      header { border-bottom: 1px solid var(--rule); padding-bottom: 1.25rem; margin-bottom: 2rem; }
      .brand { font: 700 0.8rem/1 system-ui, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
      h1 { font: 800 2rem/1.2 system-ui, -apple-system, "Helvetica Neue", sans-serif; margin: 0.75rem 0 0.4rem; }
      .meta { color: var(--muted); margin: 0; }
      ul { padding-left: 1.25rem; }
      a { color: var(--link); text-underline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">Tilde</a>
        <h1>Page not found</h1>
        <p class="meta">There is nothing at this address. The link may be old or mistyped.</p>
      </header>
      <p>Here are the places most people are looking for:</p>
      <ul>
        <li><a href="/">Tilde home page</a></li>
        <li><a href="/app">Open the web app</a></li>
        <li><a href="https://apps.apple.com/app/id6815928041">Get the Mac app</a></li>
        <li><a href="/import-opml.html">Move your feeds from another reader</a></li>
        <li><a href="/support.html">Support</a></li>
      </ul>
    </main>
  </body>
</html>
